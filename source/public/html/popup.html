<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>AutoHyperlink</title>
    <link rel="stylesheet" href="../css/popup.css"/>
</head>
<body>
    <div class="title-bar">
        <img src="../../../images/icon-48.png" class="title-bar-icon">
        <h1>AutoHyperlink</h1>
    </div>

    <div class="settings-container">
        <h2>Settings</h2>
        <div class="settings-panel">

            <div class="settings-panel-tabs">
                <button type="button" class="tab-btn active" data-panel="prefixes">Prefixes</button>
                <button type="button" class="tab-btn" data-panel="appearance">Appearance</button>
            </div>

            <!-- Prefixes Panel -->
            <div class="settings-panel-tab active" data-panel="prefixes">
                <div id="prefixes-list">
                    <input type="text" id="new-prefix" placeholder="Add new prefix" />
                    <button id="add-prefix-btn">Add Prefix</button>
                    <span id="prefix-error" class="prefix-error" aria-live="polite"></span>
                    <ul id="prefix-list">
                        <!-- Prefixes will be dynamically populated here -->
                    </ul>
                </div>
            </div>

            <!-- Appearance Panel -->
            <div class="settings-panel-tab" data-panel="appearance">
                <div id="appearance-settings">
                    <label for="link-color">Hyperlink Color:</label>
                    <input type="color" id="link-color" value="#ff0000" />
                    <button type="button" id="save-color-btn">Save</button>
                    <br />
                    <fieldset id="link-style-group" class="style-checkboxes">
                        <legend>Hyperlink Style:</legend>
                        <label><input type="checkbox" class="style-checkbox" value="underline" /> Underline</label>
                        <label><input type="checkbox" class="style-checkbox" value="bold" /> Bold</label>
                        <label><input type="checkbox" class="style-checkbox" value="italic" /> Italic</label>
                    </fieldset>
                </div>
            </div>

        </div>
    </div>

    <script src="../../Defaults.js"></script>
    <script src="../js/popup.js"></script>

</body>
</html>
